<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Campaigns</title><link rel="stylesheet" href="../css.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="../index.html">LIFE MAKER</a><a class="btn ghost" href="../index.html">Master</a></nav><p class="k">Paid marketing · human feel</p><h1>Human Campaigns</h1><p class="lede">Ads that do not scrape the nervous system.</p><label>Offer</label><select id="offer"><option value="journal">Journal $19</option><option value="wisdom">Wisdom $9</option><option value="coaster">Coaster $180</option><option value="sound">Sound $29</option><option value="farm">Farm $49</option></select><label>Daily spend AUD</label><input id="spend" type="number" value="25"><label>Copy</label><textarea id="copy" rows="5">A long dog, a quiet paddock, and a journal that does not yell.</textarea><label>Urgency</label><input id="urg" type="range" min="0" max="100" value="22"><p class="lede" id="proj"></p><div class="row"><button onclick="proj()">Project lift</button><button onclick="pushC()">Push campaign</button></div></div><script src="../shared.js"></script><script>function proj(){const s=+spend.value||0,cyc=s*14;const price={journal:19,wisdom:9,coaster:180,sound:29,farm:49}[offer.value];const rev=Math.round(cyc*0.06*price/19*2);proj.textContent='14-day spend '+cyc+' AUD. Soft estimate '+rev+' AUD if copy stays human. Kill if CPA > 40% of price.';}function pushC(){const s=+spend.value||0;bump('ads',-s,'Campaign spend');bump(offer.value,Math.max(0,Math.round(s*1.8)),'Attributed sales (sim)');alert('Campaign logged.');}</script></body></html>
