<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Den</title><link rel="stylesheet" href="../css.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="../index.html">LIFE MAKER</a><a class="btn ghost" href="../index.html">Master</a></nav><p class="k">Audio</p><h1>Sound Den</h1><div class="card"><div class="row"><button onclick="tone()">Play / stop hush</button><button class="ghost" onclick="bump('sound',7,'Tip')">Tip $7</button><button class="ghost" onclick="bump('sound',29,'Pack')">Pack $29</button></div></div></div><script src="../shared.js"></script><script>let o,on=false;function tone(){if(on){o.stop();on=false;return;}const c=new (window.AudioContext||window.webkitAudioContext)();o=c.createOscillator();const g=c.createGain();o.frequency.value=174;g.gain.value=0.03;o.connect(g);g.connect(c.destination);o.start();on=true;}</script></body></html>
